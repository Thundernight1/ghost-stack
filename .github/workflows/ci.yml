# ═══════════════════════════════════════════════════════════
# GHOST-STACK CORE — CI Pipeline
# ═══════════════════════════════════════════════════════════
#
# Runs on every push/PR. Tests pure Go logic (no kernel features needed).
# Kernel-dependent tests (eBPF, namespaces) are skipped in CI and
# covered by integration tests on real Linux targets.

name: GHOST-STACK CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

permissions:
  contents: read

env:
  GO_VERSION: '1.22'

jobs:
  # ─────────────────────────────────────────────────
  # Job 1: Lint & Vet
  # ─────────────────────────────────────────────────
  lint:
    name: Lint & Vet
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true

      - name: Install golangci-lint
        uses: golangci/golangci-lint-action@v6
        with:
          version: v1.57
          args: --timeout=5m --skip-dirs=firewall/layer2,firewall/layer3

      - name: Go Vet
        run: go vet ./hierarchy/... ./agents/beta/... ./db/... ./auth/...

  # ─────────────────────────────────────────────────
  # Job 2: Unit Tests
  # ─────────────────────────────────────────────────
  test:
    name: Unit Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true

      - name: Install SQLite dev headers
        run: sudo apt-get update && sudo apt-get install -y libsqlite3-dev

      - name: Download dependencies
        run: go mod download

      - name: Run unit tests
        run: |
          sudo sysctl -w vm.mmap_rnd_bits=28
          export GORACE="history_size=1"
          go test -v -race -count=1 -timeout=120s \
            -coverprofile=coverage.out \
            ./hierarchy/... \
            ./agents/beta/... \
            ./db/... \
            ./auth/...

      - name: Show coverage summary
        run: go tool cover -func=coverage.out | tail -1

      - name: Upload coverage artifact
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: coverage.out

  # ─────────────────────────────────────────────────
  # Job 3: Build Verification
  # ─────────────────────────────────────────────────
  build:
    name: Build Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libsqlite3-dev

      - name: Build ghost-ctl
        run: |
          CGO_ENABLED=1 go build -o ghost-ctl -ldflags="-s -w" ./cmd/ghost-ctl/

      - name: Verify binary
        run: |
          file ghost-ctl
          ./ghost-ctl version

      - name: Upload binary
        uses: actions/upload-artifact@v4
        with:
          name: ghost-ctl-linux-amd64
          path: ghost-ctl

  # ─────────────────────────────────────────────────
  # Job 4: eBPF Compilation Check
  # ─────────────────────────────────────────────────
  ebpf-compile:
    name: eBPF Compile Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install clang & BPF headers
        run: |
          sudo apt-get update
          sudo apt-get install -y clang-17 llvm libbpf-dev linux-headers-$(uname -r) linux-tools-common linux-tools-generic || true
          sudo bpftool btf dump file /sys/kernel/btf/vmlinux format c > vmlinux.h || true
          sudo cp vmlinux.h /usr/include/vmlinux.h || true

      - name: Compile Layer 2 TC BPF
        run: |
          clang-17 -O2 -g -target bpf \
            -D__TARGET_ARCH_x86 \
            -I/usr/include \
            -c firewall/layer2/layer2_tc.bpf.c \
            -o layer2_tc.bpf.o 2>&1 || echo "::warning::Layer 2 BPF compilation requires vmlinux.h — expected in CI"

      - name: Compile Layer 3 XDP BPF
        run: |
          clang-17 -O2 -g -target bpf \
            -D__TARGET_ARCH_x86 \
            -I/usr/include \
            -c firewall/layer3/layer3_invisible.bpf.c \
            -o layer3_invisible.bpf.o 2>&1 || echo "::warning::Layer 3 BPF compilation requires vmlinux.h — expected in CI"

      - name: Compile AGENT-ALPHA BPF
        run: |
          clang-17 -O2 -g -target bpf \
            -D__TARGET_ARCH_x86 \
            -I/usr/include \
            -c agents/alpha/alpha.bpf.c \
            -o alpha.bpf.o 2>&1 || echo "::warning::Alpha BPF compilation requires vmlinux.h — expected in CI"

  # ─────────────────────────────────────────────────
  # Job 5: Security Scan
  # ─────────────────────────────────────────────────
  security:
    name: Security Scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true

      - name: Run govulncheck
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@latest
          govulncheck ./... || true

      - name: Check for hardcoded secrets
        run: |
          echo "Scanning for hardcoded secrets..."
          # Check for suspicious patterns (API keys, passwords, tokens)
          FOUND=0
          grep -rn "password\s*=\s*['\"]" --include="*.go" . && FOUND=1 || true
          grep -rn "api[_-]?key\s*=\s*['\"]" --include="*.go" . && FOUND=1 || true
          grep -rn "secret\s*=\s*['\"]" --include="*.go" . && FOUND=1 || true
          if [ "$FOUND" -eq 1 ]; then
            echo "::warning::Potential hardcoded secrets detected — review above matches"
          else
            echo "✓ No hardcoded secrets found"
          fi

      - name: Verify deploy scripts are safe
        run: |
          echo "Checking deploy scripts for unsafe patterns..."
          # Verify no curl | bash, eval, or unsafe expansion
          shellcheck deploy/deploy.sh deploy/firewall_deploy.sh 2>/dev/null || \
            echo "::warning::shellcheck not available — install for full script analysis"

  # ─────────────────────────────────────────────────
  # Job 6: Nftables Syntax Check
  # ─────────────────────────────────────────────────
  nftables-check:
    name: Nftables Syntax
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install nftables
        run: sudo apt-get update && sudo apt-get install -y nftables

      - name: Validate Layer 1 rules syntax
        run: |
          sudo nft -c -f firewall/layer1/layer1_decoy.nft 2>&1 || \
            echo "::warning::nftables syntax check requires kernel module — expected in CI"
